name: CI

on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PERSISTENCE: isolated
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      STAFF_ALLOWLIST: staff@example.com
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SNIPPE_ENABLED: false
      SNIPPE_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
